<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- A clock with its hands set back, which is the ordinary way to draw
       "history". A scroll or a stack of lines would collide with the list the
       heading sits above. -->
  <g fill="none" stroke="currentColor" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.6"/>
    <path d="M12 6.6 L12 12 L16.4 14.6"/>
  </g>
</svg>
