[project]
name = "decoui"
version = "0.3.0"
description = "Decorator-driven GUI framework for Python — generate PySide6 UIs from type annotations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["gui", "decorator", "pyside6", "qt", "ui", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Essentials only: decoui imports QtCore, QtGui, QtWidgets and QtTest, all of
    # which live here. The full PySide6 metapackage additionally pulls
    # PySide6-Addons (Charts, Multimedia, WebEngine, Qt3D, ...), which triples
    # the install for modules decoui never touches. Tools that need an Addons
    # module can depend on PySide6 or PySide6-Addons themselves.
    "PySide6-Essentials>=6.6.0",
]

[project.urls]
Homepage = "https://github.com/luvmagi/decoui"
Repository = "https://github.com/luvmagi/decoui"
Issues = "https://github.com/luvmagi/decoui/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# .idea/ is committed (the JetBrains line in .gitignore is left commented out,
# as the GitHub template ships it), so hatch would otherwise pack the whole IDE
# configuration -- including a 60 KB introspected schema cache -- into every
# release. icon.psd is the source the shipped icon.png is exported from and is
# by far the largest file in the tree. Neither belongs in a source release.
exclude = [
    ".idea",
    "docs/icon.psd",
]

[tool.hatch.build.targets.wheel]
packages = ["src/decoui"]

[tool.hatch.build.targets.wheel.force-include]
"src/decoui/icon.png" = "decoui/icon.png"
"src/decoui/tab_close.svg" = "decoui/tab_close.svg"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "twine>=7.0",
]
