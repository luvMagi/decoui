[project]
name = "decoui"
version = "0.4.0"
description = "Decorator-driven GUI framework for Python — generate PySide6 UIs from type annotations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["gui", "decorator", "pyside6", "qt", "ui", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Essentials only: decoui imports QtCore, QtGui, QtWidgets, QtSvg and
    # QtTest, all of which live here. The full PySide6 metapackage pulls
    # PySide6-Addons (Charts, Multimedia, WebEngine, Qt3D, ...), which triples
    # the install for modules decoui never touches. Tools that need an Addons
    # module can depend on PySide6 or PySide6-Addons themselves.
    "PySide6-Essentials>=6.6.0",
]

[project.urls]
Homepage = "https://github.com/luvmagi/decoui"
Repository = "https://github.com/luvmagi/decoui"
Issues = "https://github.com/luvmagi/decoui/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# icon.psd is the source the shipped icon.png is exported from, and was the
# largest file in the tree; it is tracked on purpose but does not belong in a
# source release. .idea is gitignored now and would be dropped anyway -- it is
# named here so that re-committing an IDE configuration cannot silently put it
# back into a published artifact, which is how it reached 0.3.0.
exclude = [
    ".idea",
    "docs/icon.psd",
]

[tool.hatch.build.targets.wheel]
packages = ["src/decoui"]

[tool.hatch.build.targets.wheel.force-include]
"src/decoui/icon.png" = "decoui/icon.png"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "twine>=7.0",
]
